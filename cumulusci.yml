minimum_cumulusci_version: '4.11.0'
project:
    name: Visualforce-EDU-Cloud-obj-permission-test
    package:
        name: Visualforce-EDU-Cloud-obj-permission-test
        api_version: '67.0'
    git:
        default_branch: 'main'
    source_format: sfdx

tasks:
    robot:
        options:
            suites: robot/Visualforce-EDU-Cloud-obj-permission-test/tests
            options:
                outputdir: robot/Visualforce-EDU-Cloud-obj-permission-test/results

    robot_testdoc:
        options:
            path: robot/Visualforce-EDU-Cloud-obj-permission-test/tests
            output: robot/Visualforce-EDU-Cloud-obj-permission-test/doc/Visualforce-EDU-Cloud-obj-permission-test_tests.html

    run_tests:
        options:
            required_org_code_coverage_percent: 75

    create_community:
        description: Deploys configuration for Development.
        class_path: cumulusci.tasks.salesforce.CreateCommunity
        options:
            name: Visualforce Test
            description: Visualforce Test Community
            template: Build Your Own
            skip_existing: True

    create_community_network:
        description: Creates the community network for Development.
        class_path: cumulusci.tasks.salesforce.network_member_group.CreateNetworkMemberGroups
        options:
            network_name: Visualforce Test
            profile_names:
                - Customer Community Login User

    create_community_publish:
        description: Publishes the community for Development.
        class_path: cumulusci.tasks.salesforce.PublishCommunity
        options:
            name: Visualforce Test

    assign_admin_permission_sets:
        description: Gives the admin user Education Cloud access so AcademicTerm is visible and sample data can load.
        class_path: cumulusci.tasks.salesforce.users.permsets.AssignPermissionSets
        options:
            api_names: EducationCloudAccess

    deploy_academic_term_sharing:
        description: Deploys the guest sharing rule for active AcademicTerm records. Needs the site guest user, so it runs after create_community.
        class_path: cumulusci.tasks.salesforce.Deploy
        options:
            path: unpackaged/config/academic_term_sharing
            unmanaged: True

    assign_guest_permission_sets:
        description: Gives the Visualforce Test site guest user page access and the Education Cloud guest permission set.
        class_path: cumulusci.tasks.salesforce.users.permsets.AssignPermissionSets
        options:
            api_names: EduCloudTest_Page_Access,EducationCloudGuestAccess
            user_alias: guest

flows:
    config_dev:
        steps:
            1.5:
                task: assign_admin_permission_sets
            3:
                task: create_community
            3.5:
                task: deploy_academic_term_sharing
            3.7:
                task: assign_guest_permission_sets
            4:
                task: create_community_network
            7:
                task: create_community_publish
